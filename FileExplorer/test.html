<!DOCTYPE html>
<html>
<head>
    <title>Window Bing</title>
</head>
<body>
    <textarea id="result" rows="4" cols="50"></textarea>
    <script type='text/javascript'>

        var result = window.clipboardOperations.nativeMethod();
        var json = JSON.parse(result);
        document.getElementById('result').value = json.result;

        window.addEventListener('clipboardchanged', function (e) {
            document.getElementById('result').value += "янашрхе!!";
        });


    </script>
</body>
</html>
